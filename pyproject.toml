[project]
name = "vcat-standalone"
version = "0.1.0"
description = "Cross-connection test harness for the virtual_catalog DuckDB extension"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["test/python"]
timeout = 120

[dependency-groups]
dev = [
    "duckdb==1.5.4",
    "numpy>=2.5.2",
    "pyarrow>=25.0.1",
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
]
