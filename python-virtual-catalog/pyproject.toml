[project]
name = "duckdb-virtual-catalog"
version = "0.1.0"
description = "Python helpers for the vcatbridge and vcatprovider DuckDB extensions"
readme = "README.md"
authors = [
    { email = "srossross@gmail.com" }
]
requires-python = ">=3.9"
dependencies = ["duckdb>=1.5.6", "pyarrow", "numpy"]

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "virtual_catalog"

[dependency-groups]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.23",
    "python-dotenv>=1",
]

[tool.pytest.ini_options]
testpaths = ["src"]

[tool.black]
line-length = 120
